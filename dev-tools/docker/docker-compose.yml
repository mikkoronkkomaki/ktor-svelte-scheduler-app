version: '2'
services:
  scheduler-dev-container:
    image: kartoza/postgis:16-3.4--v2023.11.04
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      ALLOW_IP_RANGE: 0.0.0.0/0
      SHARED_PRELOAD_LIBRARIES: 'pg_cron,pg_stat_statements'

  migration:
    build: flyway-psql
    entrypoint: |
      /bin/bash -c "
        until flyway -url=jdbc:postgresql://scheduler-dev-container/scheduler -user=scheduler -password=scheduler info &>/dev/null; do
          echo Waiting for Flyway to connect to the DB...
          sleep 0.5
        done

        # Bugin kierto https://github.com/petere/homebrew-postgresql/issues/51
        PGGSSENCMODE=disable

        echo Remove hstore extension
        PGPASSWORD=scheduler psql -h scheduler-dev-container -p 5432 -U scheduler -c \"DROP EXTENSION hstore;\"

        echo -e '\e[1m\e[35m--- Running migrations ---\e[0m'
        flyway -url=jdbc:postgresql://scheduler-dev-container/scheduler -schemas=scheduler -locations=filesystem:/database/flyway -user=scheduler -password=scheduler migrate
        echo -e '\e[1m\e[32m--- Migraatiot ajettu ---\e[0m'

        echo -e '\e[1m\e[35m--- Ajetaan testidata ---\e[0m'
        PGPASSWORD=scheduler psql -h scheduler-dev-container -p 5432 -U scheduler scheduler -X -a -v ON_ERROR_STOP=1 --pset pager=off -f /database/testdata/init-testdata.sql > /dev/null
        echo -e '\e[1m\e[32m--- Testidata ajettu ---\e[0m'                    

        echo -e '\e[1m\e[32m\e[5m\e[4m--- Scheduler DB up. Do not close this terminal window. ---\e[0m'
        "

    volumes:
      - ../database/flyway/:/database/flyway
      - ../database/testdata/:/database/testdata

    links:
      - scheduler-dev-container

volumes:
  esdata:
